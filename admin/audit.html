<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติการแก้ไข | ระบบผู้ดูแล</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon-180.png">
<style>
  .hist-item { padding: 11px 0; border-bottom: 1px solid var(--c-line-2); }
  .hist-item:last-child { border-bottom: 0; }
  .hist-meta { color: var(--c-ink-3); font-size: .8rem; }
  .hist-diff { margin: 5px 0 0; padding-left: 17px; }
  .hist-diff li { margin-bottom: 2px; }
  .hist-diff .from { color: var(--c-err-700); text-decoration: line-through; }
  .hist-diff .to { color: var(--c-ok-700); font-weight: 600; }
  .filters { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; align-items: end; }
  @media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปเนื้อหาหลัก</a>
<header id="site-header"></header>

<main id="main">
  <div class="wrap">
    <h1>ประวัติการแก้ไขข้อมูล</h1>
    <p class="muted small">
      บันทึกว่าใครทำอะไร กับข้อมูลใด เมื่อใด ระบบบันทึกอัตโนมัติและไม่สามารถแก้ไขหรือลบได้
      ข้อมูลที่เข้ารหัสจะบันทึกเพียงว่า "มีการเปลี่ยนแปลง" โดยไม่เก็บค่าจริง
    </p>

    <div class="card">
      <div class="filters">
        <div class="field">
          <label for="f-entity">ประเภทข้อมูล</label>
          <select id="f-entity">
            <option value="">ทั้งหมด</option>
            <option value="members">สมาชิก</option>
            <option value="applications">ใบสมัคร</option>
            <option value="payments">การชำระเงิน</option>
            <option value="receipts">ใบสำคัญรับเงิน</option>
            <option value="cards">บัตรสมาชิก</option>
            <option value="admins">ผู้ดูแลระบบ</option>
            <option value="system">ระบบ</option>
          </select>
        </div>
        <div class="field">
          <label for="f-action">การกระทำ</label>
          <select id="f-action"><option value="">ทั้งหมด</option></select>
        </div>
        <div class="field">
          <label for="f-from">ตั้งแต่วันที่</label>
          <input type="date" id="f-from">
        </div>
        <div class="field">
          <label for="f-q">ค้นหา (ชื่อ/อีเมล/เลขเอกสาร)</label>
          <input type="search" id="f-q">
        </div>
      </div>
      <div class="btn-row mt-2">
        <button class="btn" id="btn-apply">กรองข้อมูล</button>
        <button class="btn btn-ghost" id="btn-clear">ล้างตัวกรอง</button>
        <span class="small muted" id="count"></span>
      </div>
    </div>

    <div class="card">
      <div id="list"><div class="loading">กำลังโหลดประวัติ...</div></div>
      <div class="btn-row btn-row-end mt-2">
        <button class="btn btn-ghost" id="btn-more" hidden>โหลดเพิ่ม</button>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/lib/audit-view.js"></script>
<script>
(function () {
  "use strict";
  var A = window.App;
  var PAGE = 50;
  var offset = 0;
  var rows = [];

  A.renderHeader("admin", "audit.html", "../");
  A.renderFooter("../");

  A.auth.requireAdmin("index.html", "audit")
    .then(function (s) {
      if (!s) return null;

      var sel = A.$("#f-action");
      Object.keys(window.AuditView.ACTION).forEach(function (k) {
        sel.appendChild(new Option(window.AuditView.ACTION[k], k));
      });

      A.$("#btn-apply").addEventListener("click", function () { reset(); });
      A.$("#btn-clear").addEventListener("click", function () {
        A.$("#f-entity").value = "";
        A.$("#f-action").value = "";
        A.$("#f-from").value = "";
        A.$("#f-q").value = "";
        reset();
      });
      A.$("#btn-more").addEventListener("click", function () { load(); });
      A.$("#f-q").addEventListener("keydown", function (e) {
        if (e.key === "Enter") reset();
      });

      return load();
    })
    .catch(function (e) {
      A.$("#list").innerHTML =
        '<div class="alert alert-err mb-0"><div>' + A.esc(A.errMsg(e)) + "</div></div>";
    });

  function reset() {
    offset = 0;
    rows = [];
    A.$("#list").innerHTML = '<div class="loading">กำลังโหลด...</div>';
    load();
  }

  function load() {
    var q = A.sb.from("audit_log").select("*", { count: "exact" })
      .order("at", { ascending: false })
      .range(offset, offset + PAGE - 1);

    var entity = A.$("#f-entity").value;
    var action = A.$("#f-action").value;
    var from = A.$("#f-from").value;
    var text = A.$("#f-q").value.trim();

    if (entity) q = q.eq("entity", entity);
    if (action) q = q.eq("action", action);
    if (from) q = q.gte("at", new Date(from).toISOString());
    if (text) {
      var esc = text.replace(/[%,()]/g, " ");
      q = q.or(
        "entity_label.ilike.%" + esc + "%," +
        "actor_email.ilike.%" + esc + "%," +
        "note.ilike.%" + esc + "%"
      );
    }

    return q.then(function (res) {
      if (res.error) throw res.error;
      var got = res.data || [];
      rows = rows.concat(got);
      offset += got.length;

      A.$("#count").textContent =
        "แสดง " + A.fmt.int(rows.length) +
        (res.count !== null && res.count !== undefined ? " จาก " + A.fmt.int(res.count) : "") +
        " รายการ";

      window.AuditView.renderList("#list", rows, "ไม่พบประวัติที่ตรงกับเงื่อนไข");
      A.$("#btn-more").hidden = got.length < PAGE;
    }).catch(function (e) {
      A.$("#list").innerHTML =
        '<div class="alert alert-err mb-0"><div>' + A.esc(A.errMsg(e)) + "</div></div>";
    });
  }
})();
</script>
</body>
</html>
