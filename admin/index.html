<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบผู้ดูแล | ชมรมอนามัยสิ่งแวดล้อมจังหวัดบุรีรัมย์</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon-180.png">
</head>
<body>
<header id="site-header"></header>
<main id="main">
  <div class="wrap wrap-narrow">
    <h1>เข้าสู่ระบบผู้ดูแล</h1>
    <p class="muted small">
      สำหรับเจ้าหน้าที่ทะเบียนและเจ้าหน้าที่การเงินของชมรมเท่านั้น
    </p>

    <div class="card">
      <form id="f" novalidate>
        <div class="field mb-2">
          <label class="req" for="email">อีเมลผู้ดูแล</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field mb-2">
          <label class="req" for="pw">รหัสผ่าน</label>
          <input type="password" id="pw" autocomplete="current-password" required>
        </div>
        <div class="btn-row mt-2">
          <button class="btn btn-lg" type="submit" id="btn">เข้าสู่ระบบผู้ดูแล</button>
          <a class="btn btn-ghost" href="../index.html">กลับหน้าแรก</a>
        </div>
      </form>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>

<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  var A = window.App;
  A.renderHeader("public", null, "../");
  A.renderFooter("../");

  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "dashboard.html";
  if (/^(https?:)?\/\//.test(next) || next.charAt(0) === "/") next = "dashboard.html";

  // ล็อกอินอยู่แล้วและเป็นผู้ดูแล ให้เข้าไปเลย
  A.auth.session().then(function (s) {
    if (!s) return;
    A.rpc("is_admin").then(function (ok) {
      if (ok) location.replace(next);
    }).catch(function () {});
  });

  A.$("#f").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = A.$("#btn");
    var email = A.$("#email").value.trim().toLowerCase();
    var pass = A.$("#pw").value;
    if (!email || !pass) { A.toast("กรุณากรอกอีเมลและรหัสผ่าน", "warn"); return; }

    A.busy(btn, true, "กำลังตรวจสอบสิทธิ์...");
    A.sb.auth.signInWithPassword({ email: email, password: pass })
      .then(function (res) {
        if (res.error) throw res.error;
        return A.rpc("is_admin");
      })
      .then(function (ok) {
        if (!ok) {
          A.busy(btn, false);
          A.toast("บัญชีนี้เข้าสู่ระบบได้ แต่ไม่มีสิทธิ์ผู้ดูแลระบบ", "err", 9000);
          return null;
        }
        return A.rpc("log_client_event", { p_action: "login", p_note: "เข้าสู่ระบบผู้ดูแล" })
          .catch(function () {})
          .then(function () { location.href = next; });
      })
      .catch(function (err) {
        A.busy(btn, false);
        A.toast(A.errMsg(err), "err");
      });
  });
})();
</script>
</body>
</html>
