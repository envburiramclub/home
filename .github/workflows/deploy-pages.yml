name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
          touch _site/.nojekyll
          echo "ไฟล์ที่จะขึ้นเว็บ:"
          find _site -type f | wc -l

      # ต่อหมายเลขรุ่นท้าย URL ของไฟล์ในคลัง assets ทุกไฟล์ที่หน้าเว็บอ้างถึง
      #
      # GitHub Pages ส่งส่วนหัว Cache-Control ให้เบราว์เซอร์เก็บไฟล์ไว้ใช้ซ้ำได้
      # โดยไม่ถามเซิร์ฟเวอร์ ชื่อไฟล์ไม่เปลี่ยนเมื่อแก้โค้ด เบราว์เซอร์ของผู้ใช้
      # ที่เคยเปิดเว็บมาก่อนจึงยังใช้ไฟล์เดิม และเห็นบัตรสมาชิกแบบเก่าทั้งที่
      # เว็บขึ้นโค้ดใหม่แล้ว
      #
      # เติม ?v=<เลขคอมมิต> ทำให้ URL เปลี่ยนทุกครั้งที่โค้ดเปลี่ยน
      # เบราว์เซอร์จึงโหลดไฟล์ใหม่ทันทีที่ขึ้นเว็บ ไม่ต้องให้ผู้ใช้ล้างแคชเอง
      # และไฟล์ที่ไม่เปลี่ยนก็ยังใช้แคชเดิมได้เพราะเลขรุ่นเปลี่ยนตามคอมมิตของทั้งคลัง
      #
      # ทำกับไฟล์ที่ staging เท่านั้น ไฟล์ในคลังไม่ถูกแก้
      - name: Stamp asset version
        run: |
          V="${GITHUB_SHA:0:7}"
          find _site -name '*.html' -print0 |
            xargs -0 sed -i -E "s@(src|href)=\"((\.\./)*assets/[^\"?]+)\"@\1=\"\2?v=$V\"@g"
          echo "เลขรุ่น: $V"
          echo "จำนวน URL ที่ต่อเลขรุ่นแล้ว:"
          grep -roh "?v=$V" _site --include='*.html' | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
